name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  determine-triggers:
    name: Determine Review Triggers
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null)
    runs-on: ubuntu-latest
    outputs:
      should_run_gemini: ${{ steps.check.outputs.should_run_gemini }}
      should_run_claude: ${{ steps.check.outputs.should_run_claude }}
      should_run_copilot: ${{ steps.check.outputs.should_run_copilot }}
      pr_number: ${{ steps.check.outputs.pr_number }}
    steps:
      - name: Inspect trigger event and comment
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          PR_NUM: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          RUN_GEMINI="false"
          RUN_CLAUDE="false"
          RUN_COPILOT="false"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ "$IS_DRAFT" != "true" ]; then
              RUN_GEMINI="true"
              RUN_CLAUDE="true"
              RUN_COPILOT="true"
            fi
          elif [ "$EVENT_NAME" = "issue_comment" ]; then
            COMMENT_LOWER=$(echo "$COMMENT_BODY" | tr '[:upper:]' '[:lower:]')

            if echo "$COMMENT_LOWER" | grep -Eq '(/review|/ai-review)'; then
              RUN_GEMINI="true"
              RUN_CLAUDE="true"
              RUN_COPILOT="true"
            fi
            if echo "$COMMENT_LOWER" | grep -Eq '(/gemini-review|@gemini)'; then
              RUN_GEMINI="true"
            fi
            if echo "$COMMENT_LOWER" | grep -Eq '(/claude-review|@claude)'; then
              RUN_CLAUDE="true"
            fi
            if echo "$COMMENT_LOWER" | grep -Eq '(/copilot-review|@copilot|@github-copilot)'; then
              RUN_COPILOT="true"
            fi
          fi

          echo "should_run_gemini=$RUN_GEMINI" >> "$GITHUB_OUTPUT"
          echo "should_run_claude=$RUN_CLAUDE" >> "$GITHUB_OUTPUT"
          echo "should_run_copilot=$RUN_COPILOT" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUM" >> "$GITHUB_OUTPUT"

  gemini-review:
    name: Google Gemini Review
    needs: determine-triggers
    if: needs.determine-triggers.outputs.should_run_gemini == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run Gemini Reviewer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.determine-triggers.outputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          python3 - << 'EOF'
          import json, os, subprocess, urllib.request, urllib.error

          api_key = os.environ.get("GEMINI_API_KEY")
          gh_token = os.environ.get("GH_TOKEN")
          pr_number = os.environ.get("PR_NUMBER")
          repo = os.environ.get("REPO")

          if not api_key:
              print("::warning ::GEMINI_API_KEY is not set. Skipping Gemini review.")
              exit(0)

          # Fetch PR metadata & diff
          headers = {
              "Authorization": f"Bearer {gh_token}",
              "Accept": "application/vnd.github.v3.diff",
              "User-Agent": "GitHub-Action-Gemini-Reviewer"
          }
          req = urllib.request.Request(f"https://api.github.com/repos/{repo}/pulls/{pr_number}", headers=headers)
          try:
              with urllib.request.urlopen(req) as resp:
                  diff_text = resp.read().decode('utf-8')
          except Exception as e:
              print(f"Error fetching PR diff: {e}")
              exit(1)

          if not diff_text.strip():
              print("Diff is empty. Skipping review.")
              exit(0)

          # Load guidelines if available
          guidelines = ""
          if os.path.exists("GEMINI.md"):
              with open("GEMINI.md", "r") as f:
                  guidelines = f.read()

          system_prompt = (
              "You are Google Gemini performing an automated Rust code review on a GitHub Pull Request.\n"
              "Review the following PR git diff against the project's standards and guidelines.\n"
              "Check for:\n"
              "1. Adherence to test-driven development and comprehensive testing.\n"
              "2. Modularity, short focused functions/files, and absence of monoliths.\n"
              "3. Rust idioms, safety, error handling, performance, and correctness.\n"
              "4. Any missing documentation or roadmap updates.\n\n"
              "Provide a concise, constructive markdown review with clear action items and code suggestions where appropriate.\n\n"
              f"Project Guidelines (GEMINI.md):\n{guidelines}"
          )

          user_content = f"PR #{pr_number} Git Diff:\n\n```diff\n{diff_text[:60000]}\n```"

          url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key={api_key}"
          payload = {
              "contents": [
                  {"role": "user", "parts": [{"text": system_prompt + "\n\n" + user_content}]}
              ]
          }

          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode('utf-8'),
              headers={"Content-Type": "application/json"}
          )

          try:
              with urllib.request.urlopen(req) as resp:
                  result = json.loads(resp.read().decode('utf-8'))
                  review_body = result["candidates"][0]["content"]["parts"][0]["text"]
          except Exception as e:
              print(f"Error calling Gemini API: {e}")
              exit(1)

          # Post review comment to GitHub PR
          comment_body = f"## 🤖 Google Gemini PR Review\n\n{review_body}\n\n---\n*Summon Gemini anytime by commenting `/gemini-review` or `@gemini`.*"
          post_req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/issues/{pr_number}/comments",
              data=json.dumps({"body": comment_body}).encode('utf-8'),
              headers={
                  "Authorization": f"Bearer {gh_token}",
                  "Accept": "application/vnd.github.v3+json",
                  "Content-Type": "application/json",
                  "User-Agent": "GitHub-Action-Gemini-Reviewer"
              }
          )
          with urllib.request.urlopen(post_req) as resp:
              print("Gemini review posted successfully.")
          EOF

  claude-review:
    name: Anthropic Claude Review
    needs: determine-triggers
    if: needs.determine-triggers.outputs.should_run_claude == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run Claude Reviewer
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.determine-triggers.outputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          python3 - << 'EOF'
          import json, os, subprocess, urllib.request, urllib.error

          api_key = os.environ.get("ANTHROPIC_API_KEY")
          gh_token = os.environ.get("GH_TOKEN")
          pr_number = os.environ.get("PR_NUMBER")
          repo = os.environ.get("REPO")

          if not api_key:
              print("::warning ::ANTHROPIC_API_KEY is not set. Skipping Claude review.")
              exit(0)

          # Fetch PR diff
          headers = {
              "Authorization": f"Bearer {gh_token}",
              "Accept": "application/vnd.github.v3.diff",
              "User-Agent": "GitHub-Action-Claude-Reviewer"
          }
          req = urllib.request.Request(f"https://api.github.com/repos/{repo}/pulls/{pr_number}", headers=headers)
          try:
              with urllib.request.urlopen(req) as resp:
                  diff_text = resp.read().decode('utf-8')
          except Exception as e:
              print(f"Error fetching PR diff: {e}")
              exit(1)

          if not diff_text.strip():
              print("Diff is empty. Skipping review.")
              exit(0)

          # Load guidelines
          guidelines = ""
          if os.path.exists("CLAUDE.md"):
              with open("CLAUDE.md", "r") as f:
                  guidelines = f.read()

          system_prompt = (
              "You are Claude performing an automated Rust code review on a GitHub Pull Request.\n"
              "Review the following PR git diff against the project's standards and guidelines.\n"
              "Check for:\n"
              "1. Adherence to test-driven development and comprehensive testing.\n"
              "2. Modularity, short focused functions/files, and absence of monoliths.\n"
              "3. Rust idioms, safety, error handling, performance, and correctness.\n"
              "4. Any missing documentation or roadmap updates.\n\n"
              "Provide a concise, constructive markdown review with clear action items and code suggestions where appropriate.\n\n"
              f"Project Guidelines (CLAUDE.md):\n{guidelines}"
          )

          user_content = f"PR #{pr_number} Git Diff:\n\n```diff\n{diff_text[:60000]}\n```"

          url = "https://api.anthropic.com/v1/messages"
          payload = {
              "model": "claude-3-5-sonnet-latest",
              "max_tokens": 2048,
              "system": system_prompt,
              "messages": [
                  {"role": "user", "content": user_content}
              ]
          }

          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode('utf-8'),
              headers={
                  "x-api-key": api_key,
                  "anthropic-version": "2023-06-01",
                  "content-type": "application/json"
              }
          )

          try:
              with urllib.request.urlopen(req) as resp:
                  result = json.loads(resp.read().decode('utf-8'))
                  review_body = result["content"][0]["text"]
          except Exception as e:
              print(f"Error calling Anthropic API: {e}")
              exit(1)

          # Post review comment to GitHub PR
          comment_body = f"## 🎭 Anthropic Claude PR Review\n\n{review_body}\n\n---\n*Summon Claude anytime by commenting `/claude-review` or `@claude`.*"
          post_req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/issues/{pr_number}/comments",
              data=json.dumps({"body": comment_body}).encode('utf-8'),
              headers={
                  "Authorization": f"Bearer {gh_token}",
                  "Accept": "application/vnd.github.v3+json",
                  "Content-Type": "application/json",
                  "User-Agent": "GitHub-Action-Claude-Reviewer"
              }
          )
          with urllib.request.urlopen(post_req) as resp:
              print("Claude review posted successfully.")
          EOF

  copilot-review:
    name: GitHub Copilot Review
    needs: determine-triggers
    if: needs.determine-triggers.outputs.should_run_copilot == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger GitHub Copilot Review Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.determine-triggers.outputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          # If GitHub Copilot Code Review is enabled on the repository, request review
          echo "Triggering Copilot review integration on PR #${PR_NUMBER}"
          gh api --silent \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPO}/pulls/${PR_NUMBER}/requested_reviewers" \
            -f "reviewers[]=github-copilot" 2>/dev/null || true
