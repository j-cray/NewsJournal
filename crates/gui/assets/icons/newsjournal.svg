<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="cosmic-glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a7bd5" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#3a6073" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1e222d" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="paper-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#409eff"/>
      <stop offset="100%" stop-color="#36cfc9"/>
    </linearGradient>
    <filter id="glass-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base App Tile (COSMIC rounded square) -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#cosmic-glass-grad)" filter="url(#glass-shadow)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

  <!-- Frosted Glass Underlay -->
  <rect x="16" y="16" width="96" height="96" rx="20" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>

  <!-- Newspaper / Journal Body -->
  <rect x="26" y="26" width="76" height="76" rx="10" fill="url(#paper-grad)" filter="url(#glass-shadow)"/>

  <!-- Journal Header Accent Bar -->
  <rect x="34" y="34" width="60" height="8" rx="4" fill="url(#accent-grad)"/>

  <!-- Article Headline Mock Rows -->
  <rect x="34" y="48" width="34" height="20" rx="4" fill="#cbd5e1"/>
  <rect x="72" y="48" width="22" height="4" rx="2" fill="#475569"/>
  <rect x="72" y="56" width="22" height="4" rx="2" fill="#64748b"/>
  <rect x="72" y="64" width="16" height="4" rx="2" fill="#94a3b8"/>

  <!-- Column Divider & Body Lines -->
  <line x1="34" y1="74" x2="94" y2="74" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="34" y="80" width="26" height="4" rx="2" fill="#64748b"/>
  <rect x="34" y="88" width="20" height="4" rx="2" fill="#94a3b8"/>
  <rect x="66" y="80" width="28" height="4" rx="2" fill="#64748b"/>
  <rect x="66" y="88" width="24" height="4" rx="2" fill="#94a3b8"/>

  <!-- Overdue/Urgent Indicator Pip -->
  <circle cx="94" cy="34" r="5" fill="#ff4d4f" stroke="#ffffff" stroke-width="1.5"/>
</svg>
