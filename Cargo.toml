[workspace]
members = [
    "crates/core",
    "crates/gui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["NewsJournal Contributors"]
license = "Apache-2.0"
repository = "https://github.com/j-cray/NewsJournal"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
thiserror = "2.0"
rusqlite = { version = "0.32", features = ["bundled", "chrono", "uuid"] }
directories = "5.0"
proptest = "1.5"
